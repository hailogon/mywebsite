<script type="text/javascript">
  var c=document.getElementById('sc');
  var x=c.getContext('2d');
  var S=[];
  for(var i=0;i<280;i++){
    S.push({
      px:Math.random(),py:Math.random(),
      r:Math.random()*1.3+0.2,
      a:Math.random()*0.6+0.3,
      sp:Math.random()*0.015+0.004,
      ph:Math.random()*Math.PI*2
    });
  }
  function resize(){
    c.width=window.innerWidth;
    c.height=Math.max(window.innerHeight,document.body.scrollHeight);
  }
  var t=0;
  function draw(){
    x.clearRect(0,0,c.width,c.height);
    for(var i=0;i<S.length;i++){
      var s=S[i];
      var a=s.a*(0.5+0.5*Math.sin(t*s.sp*60+s.ph));
      x.beginPath();
      x.arc(s.px*c.width,s.py*c.height,s.r,0,Math.PI*2);
      x.fillStyle='rgba(255,255,255,'+a.toFixed(3)+')';
      x.fill();
    }
    t+=0.016;
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize',resize);
  resize();
  draw();
</script>
